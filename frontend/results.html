<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>추천 결과 — Lab Finder</title>
  <style>
    :root {
      --colors-primary:       #024ad8;
      --colors-primary-bright:#296ef9;
      --colors-primary-deep:  #0e3191;
      --colors-primary-soft:  #c9e0fc;
      --colors-canvas:        #ffffff;
      --colors-cloud:         #f7f7f7;
      --colors-fog:           #e8e8e8;
      --colors-steel:         #c2c2c2;
      --colors-ink:           #1a1a1a;
      --colors-on-ink:        #ffffff;
      --colors-charcoal:      #3d3d3d;
      --colors-graphite:      #636363;
      --colors-bloom-coral:   #ff5050;
      --colors-bloom-rose:    #f9d4d2;
      --rounded-md:   4px;
      --rounded-lg:   8px;
      --rounded-xl:   16px;
      --rounded-pill: 9999px;
      --spacing-xs:   8px;
      --spacing-sm:   12px;
      --spacing-md:   16px;
      --spacing-lg:   20px;
      --spacing-xl:   24px;
      --spacing-xxl:  32px;
      --spacing-section: 80px;
      --shadow-soft: 0 2px 8px rgba(26,26,26,0.08);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Manrope', 'Inter', Arial, sans-serif;
      font-size: 16px; font-weight: 400; line-height: 1.38;
      color: var(--colors-ink); background: var(--colors-canvas);
    }
    .utility-strip {
      background: var(--colors-ink); color: var(--colors-on-ink);
      height: 36px; display: flex; align-items: center;
      justify-content: flex-end; padding: 0 var(--spacing-xl);
      font-size: 14px; gap: var(--spacing-xl);
    }
    .utility-strip a { color: var(--colors-on-ink); text-decoration: none; }
    .nav-bar {
      background: var(--colors-canvas); height: 64px;
      display: flex; align-items: center; padding: 0 32px;
      gap: var(--spacing-xl); border-bottom: 1px solid var(--colors-fog);
    }
    .nav-logo { font-size: 20px; font-weight: 700; color: var(--colors-ink); text-decoration: none; margin-right: auto; }
    .nav-links { display: flex; gap: 4px; }
    .nav-link { color: var(--colors-ink); text-decoration: none; font-size: 16px; padding: var(--spacing-xs) var(--spacing-md); border-radius: var(--rounded-md); }
    .nav-link.active { border-bottom: 2px solid var(--colors-primary); }
    .container { max-width: 1366px; margin: 0 auto; padding: 0 32px; }

    /* Mode Toggle */
    .mode-band {
      background: var(--colors-cloud);
      padding: var(--spacing-xl) 0;
      border-bottom: 1px solid var(--colors-fog);
    }
    .mode-toggle { display: flex; gap: var(--spacing-md); align-items: center; }
    .mode-label { font-size: 14px; font-weight: 600; color: var(--colors-graphite); text-transform: uppercase; letter-spacing: 0.7px; }
    .category-tab {
      background: var(--colors-canvas); color: var(--colors-ink);
      border: 1px solid var(--colors-steel); border-radius: var(--rounded-pill);
      padding: var(--spacing-xs) var(--spacing-xl);
      font-size: 14px; font-weight: 500; cursor: pointer; text-decoration: none;
    }
    .category-tab.active { background: var(--colors-ink); color: var(--colors-on-ink); border-color: var(--colors-ink); }

    /* Result Section */
    .results-section { padding: var(--spacing-section) 0; }
    .results-header { margin-bottom: var(--spacing-xxl); }
    .results-eyebrow { font-size: 14px; font-weight: 600; color: var(--colors-primary); text-transform: uppercase; letter-spacing: 0.7px; margin-bottom: var(--spacing-xs); }
    .results-headline { font-size: 32px; font-weight: 500; line-height: 1.0; }
    .results-sub { font-size: 16px; color: var(--colors-charcoal); margin-top: var(--spacing-xs); }

    /* ── LITE Mode — 목록 카드 ───────────────────── */
    .lite-list { display: flex; flex-direction: column; gap: var(--spacing-md); }
    .lab-row-card {
      background: var(--colors-canvas);
      border-radius: var(--rounded-xl);
      padding: var(--spacing-xl);
      box-shadow: var(--shadow-soft);
      display: flex; align-items: center; gap: var(--spacing-xl);
    }
    .lab-row-rank {
      font-size: 24px; font-weight: 500; color: var(--colors-steel);
      min-width: 40px; text-align: center;
    }
    .lab-row-info { flex: 1; }
    .lab-row-name { font-size: 20px; font-weight: 500; margin-bottom: 4px; }
    .lab-row-dept { font-size: 14px; color: var(--colors-graphite); margin-bottom: var(--spacing-xs); }
    .lab-row-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .kw-tag {
      background: var(--colors-cloud); color: var(--colors-charcoal);
      border-radius: var(--rounded-pill); padding: 4px 10px; font-size: 12px; font-weight: 500;
    }
    .recruit-badge {
      font-size: 12px; font-weight: 700; padding: 4px 10px;
      border-radius: var(--rounded-lg); white-space: nowrap;
    }
    .recruit-open  { background: #d4edda; color: #155724; }
    .recruit-close { background: var(--colors-fog); color: var(--colors-graphite); }
    .lab-row-action { display: flex; flex-direction: column; gap: var(--spacing-xs); align-items: flex-end; }

    /* ── MATCH Mode — Top 3 카드 ─────────────────── */
    .match-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--spacing-xl); }
    .match-card {
      background: var(--colors-canvas);
      border-radius: var(--rounded-xl);
      padding: var(--spacing-xxl);
      box-shadow: var(--shadow-soft);
      display: flex; flex-direction: column; gap: var(--spacing-md);
      transition: box-shadow 0.15s, transform 0.15s;
      color: inherit;
      width: 100%;
    }
    .match-card:hover { box-shadow: 0 6px 20px rgba(26,26,26,0.13); transform: translateY(-2px); }
    .match-card-rank { font-size: 24px; font-weight: 700; }
    .match-card-name-row { display: flex; align-items: baseline; gap: var(--spacing-md); flex-wrap: wrap; }
    .match-card-name { font-size: 20px; font-weight: 500; }
    .match-card-email-inline { font-size: 13px; color: var(--colors-graphite); }
    .match-card-dept { font-size: 14px; color: var(--colors-graphite); }
    .match-card-footer {
      margin-top: auto;
      display: flex; gap: var(--spacing-sm); align-items: center; flex-wrap: wrap;
      padding-top: var(--spacing-md); border-top: 1px solid var(--colors-fog);
    }

    /* 추천 이유 — 불릿 구조 */
    .match-reason-box {
      background: var(--colors-cloud);
      border-radius: var(--rounded-lg);
      padding: var(--spacing-md) var(--spacing-xl);
      border-left: 3px solid var(--colors-primary);
      display: flex; flex-direction: column; gap: 6px;
    }
    .reason-row {
      display: flex; align-items: flex-start; gap: 8px;
      font-size: 14px; color: var(--colors-charcoal); line-height: 1.5;
    }
    .reason-icon { flex-shrink: 0; font-size: 14px; margin-top: 1px; }
    .reason-text { flex: 1; }
    .match-card-meta { display: flex; gap: var(--spacing-xs); flex-wrap: wrap; align-items: center; }
    .match-card-email { font-size: 13px; color: var(--colors-graphite); flex: 1; }

    /* 업그레이드 배너 (LITE → MATCH) */
    .upgrade-banner {
      background: var(--colors-primary-soft);
      border-radius: var(--rounded-xl);
      padding: var(--spacing-xl) var(--spacing-xxl);
      display: flex; align-items: center; justify-content: space-between;
      gap: var(--spacing-xl); margin-top: var(--spacing-xxl);
      flex-wrap: wrap;
    }
    .upgrade-banner-text h3 { font-size: 20px; font-weight: 500; margin-bottom: 4px; }
    .upgrade-banner-text p  { font-size: 14px; color: var(--colors-charcoal); }

    /* Buttons */
    .btn-primary {
      background: var(--colors-primary); color: var(--colors-on-ink);
      border: none; border-radius: var(--rounded-md);
      padding: var(--spacing-sm) var(--spacing-xl); height: 44px;
      font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.7px;
      cursor: pointer; text-decoration: none; display: inline-flex; align-items: center;
    }
    .btn-primary:hover { background: var(--colors-primary-deep); }
    .btn-outline {
      background: var(--colors-canvas); color: var(--colors-primary);
      border: 1px solid var(--colors-primary); border-radius: var(--rounded-md);
      padding: var(--spacing-sm) var(--spacing-xl); height: 44px;
      font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.7px;
      cursor: pointer; text-decoration: none; display: inline-flex; align-items: center;
    }
    .btn-outline-sm {
      background: var(--colors-canvas); color: var(--colors-ink);
      border: 1px solid var(--colors-ink); border-radius: var(--rounded-md);
      padding: 6px var(--spacing-md); height: 36px;
      font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.7px;
      cursor: pointer; text-decoration: none; display: inline-flex; align-items: center;
      white-space: nowrap;
    }

    /* Help + Footer */
    .help-band {
      background: var(--colors-ink); color: var(--colors-on-ink);
      padding: 64px var(--spacing-xl); text-align: center;
    }
    .help-band-headline { font-size: 32px; font-weight: 500; line-height: 1.0; margin-bottom: var(--spacing-xl); }
    .help-band-tabs { display: flex; gap: var(--spacing-md); justify-content: center; flex-wrap: wrap; }
    .help-tab {
      background: transparent; color: var(--colors-on-ink);
      border: 1px solid var(--colors-steel); border-radius: var(--rounded-pill);
      padding: var(--spacing-xs) var(--spacing-xl); font-size: 14px; font-weight: 500;
      cursor: pointer; text-decoration: none;
    }
    footer {
      background: var(--colors-ink); color: var(--colors-on-ink);
      padding: 48px 32px 32px; border-top: 1px solid #333;
    }
    .footer-bottom { font-size: 12px; color: var(--colors-graphite); padding-top: var(--spacing-md); border-top: 1px solid #333; }

    @media (max-width: 1024px) { .match-grid { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 640px)  { .match-grid { grid-template-columns: 1fr; } .lab-row-card { flex-direction: column; align-items: flex-start; } }
  </style>
</head>
<body>

<div class="utility-strip">
  <a href="#">숙명여자대학교</a>
  <a href="#">로그인</a>
</div>
<nav class="nav-bar">
  <a class="nav-logo" href="index.html">Lab Finder</a>
  <div class="nav-links">
    <a class="nav-link" href="index.html">연구실 탐색</a>
    <a class="nav-link active" href="results.html">추천 결과</a>
    <a class="nav-link" href="email.html">이메일 작성</a>
  </div>
</nav>

<!-- Mode Toggle Band -->
<div class="mode-band">
  <div class="container">
    <div class="mode-toggle">
      <span class="mode-label">결과 모드</span>
      <a class="category-tab active" href="#" id="tab-lite" onclick="showMode('lite'); return false;">LITE — 전체 목록</a>
      <a class="category-tab" href="#" id="tab-match" onclick="showMode('match'); return false;">MATCH — Top 3 맞춤 추천</a>
    </div>
  </div>
</div>

<!-- Results -->
<section class="results-section">
  <div class="container">

    <!-- LITE Mode — JS로 렌더링 -->
    <div id="mode-lite">
      <div style="text-align:center;padding:80px 24px;color:var(--colors-graphite)">
        <div style="font-size:48px;margin-bottom:16px">🔍</div>
        <h3 style="font-size:20px;font-weight:500;margin-bottom:8px">연구실 탐색 결과가 여기에 표시됩니다</h3>
        <p style="margin-bottom:24px">먼저 키워드를 선택하고 검색해주세요.</p>
        <a class="btn-primary" href="index.html">연구실 탐색하러 가기</a>
      </div>
    </div>

    <!-- MATCH Mode — JS로 렌더링 -->
    <div id="mode-match" style="display:none;">
      <div style="text-align:center;padding:80px 24px;color:var(--colors-graphite)">
        <div style="font-size:48px;margin-bottom:16px">✨</div>
        <h3 style="font-size:20px;font-weight:500;margin-bottom:8px">선택 정보를 입력하면 Top 3 맞춤 추천을 받을 수 있어요!</h3>
        <p style="margin-bottom:24px">연구 목적, 활동 방식, 보유 역량 중 하나 이상을 선택해 주세요.</p>
        <a class="btn-primary" href="index.html#form-section">추가 정보 입력하기</a>
      </div>
    </div>

  </div>
</section>

<section class="help-band">
  <div class="container">
    <h2 class="help-band-headline">다시 탐색하시겠어요?</h2>
    <div class="help-band-tabs">
      <a class="help-tab" href="index.html">처음으로</a>
      <a class="help-tab" href="email.html">이메일 작성</a>
    </div>
  </div>
</section>

<footer>
  <div class="container">
    <div class="footer-bottom">© 2026 Lab Finder — 숙명여자대학교 해커톤 프로젝트</div>
  </div>
</footer>

<script>
  function showMode(mode) {
    document.getElementById('mode-lite').style.display  = mode === 'lite'  ? 'block' : 'none';
    document.getElementById('mode-match').style.display = mode === 'match' ? 'block' : 'none';
    document.getElementById('tab-lite').className  = 'category-tab' + (mode === 'lite'  ? ' active' : '');
    document.getElementById('tab-match').className = 'category-tab' + (mode === 'match' ? ' active' : '');
  }

  /* ── 마크다운 테이블 → LITE 카드 파싱 ───────────────── */
  function parseLiteCards(text, searchKeywords) {
    const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
    const rows = lines.filter(l => l.startsWith('|') && !l.match(/^[\|\s\-:]+$/));
    const dataRows = rows.filter(l => !/교수명|professor/i.test(l));
    if (!dataRows.length) return null;

    return dataRows.map(row => {
      const cols    = row.split('|').map(c => c.trim()).filter(Boolean);
      const name    = (cols[0] || '').replace(/\*\*/g, '').trim();
      const dept    = (cols[1] || '').trim();
      const kwRaw   = cols[2] || '';
      const recruit = cols[3] || '';
      const isOpen  = recruit.includes('모집 중') || recruit.includes('✅');
      const keywords = kwRaw.split(',').map(k => k.trim()).filter(Boolean);

      // 검색 키워드 중 실제 일치한 것 표시
      const matched = searchKeywords.filter(sk =>
        keywords.some(k => k.toLowerCase().includes(sk.toLowerCase()) || sk.toLowerCase().includes(k.toLowerCase()))
      );

      return { name, dept, keywords, matched, isOpen };
    });
  }

  /* ── LITE 카드 HTML 생성 ─────────────────────────────── */
  function renderLiteCards(cards, searchKeywords) {
    return `
      <div class="results-header">
        <div class="results-eyebrow">LITE 모드</div>
        <h2 class="results-headline">키워드 관련 연구실 목록 <span style="font-size:18px;font-weight:400;color:var(--colors-graphite)">(${cards.length}개)</span></h2>
        <p class="results-sub">선택한 키워드 <strong>${searchKeywords.join(', ')}</strong> 중 하나라도 포함된 연구실입니다.</p>
      </div>
      <div class="lite-list">
        ${cards.map(c => `
          <div class="lab-row-card">
            <div class="lab-row-info">
              <div class="lab-row-name">${c.name} 교수</div>
              <div class="lab-row-dept">${c.dept}</div>
              <div class="lab-row-tags">
                ${c.matched.length ? c.matched.map(k => `<span class="kw-tag" style="background:#dbeafe;color:#1d4ed8;font-weight:600">🎯 ${k}</span>`).join('') : ''}
                ${c.keywords.filter(k => !c.matched.includes(k)).map(k => `<span class="kw-tag">${k}</span>`).join('')}
                <span class="recruit-badge ${c.isOpen ? 'recruit-open' : 'recruit-close'}">${c.isOpen ? '✅ 모집 중' : '❌ 마감'}</span>
              </div>
            </div>
            <div class="lab-row-action">
              <a class="btn-primary" href="email.html">✉️ 메일 쓰기</a>
            </div>
          </div>`).join('')}
      </div>
      <div class="upgrade-banner">
        <div class="upgrade-banner-text">
          <h3>💡 나에게 딱 맞는 연구실을 찾고 싶다면?</h3>
          <p>추가 정보를 입력하시면 Top 3를 맞춤 추천해 드려요.</p>
        </div>
        <a class="btn-primary" href="index.html#form-section">추가 정보 입력하기</a>
      </div>`;
  }

  /* ── MATCH 카드 HTML 생성 ────────────────────────────── */
  // 에이전트 응답 형식: "### 🥇 1순위 | 임유진 교수님 | 인공지능공학부"
  function renderMatchCards(text) {
    const rankEmoji = ['🥇', '🥈', '🥉'];

    // ### 로 시작하는 순위 블록 분리
    const blocks = text.split(/\n(?=###\s)/).filter(b => /1순위|2순위|3순위/.test(b));

    if (blocks.length === 0) {
      return `<div style="white-space:pre-wrap;line-height:1.9;padding:24px;font-size:15px">${text}</div>`;
    }

    const cards = blocks.slice(0, 3).map((block, i) => {
      // 헤더 행: ### 🥇 1순위 | 임유진 교수님 | 인공지능공학부
      const headerLine = block.split('\n')[0];
      const parts = headerLine.replace(/^###\s*/, '').split('|').map(s => s.trim());
      // parts[0] = "🥇 1순위", parts[1] = "임유진 교수님", parts[2] = "인공지능공학부"
      const rawName = (parts[1] || '').replace(/교수님?/g, '').replace(/\*\*/g,'').trim();
      const dept    = (parts[2] || '').replace(/\*\*/g,'').trim();

      const urlMatch   = block.match(/(https?:\/\/phdkim\.net\/professor\/\d+\/info)/);
      const isOpen     = block.includes('모집 중') && !block.includes('마감');
      const url        = urlMatch ? urlMatch[1] : '#';

      // 추천 이유: "- " 또는 "* " 로 시작하는 줄, **추천 이유:** 이후
      const reasonLines = block.split('\n')
        .filter(l => /^[-*]\s/.test(l.trim()))
        .map(l => l.replace(/^[-*]\s*/, '').replace(/\*\*/g,'').trim())
        .filter(l => l && !/^추천 이유/.test(l))
        .slice(0, 3);

      return `
        <div class="match-card">
          <div class="match-card-rank">${rankEmoji[i] || ''} ${i+1}순위</div>
          <div>
            <div class="match-card-name-row">
              <span class="match-card-name">${rawName} 교수</span>
            </div>
            <div class="match-card-dept">${dept}</div>
          </div>
          <div class="match-card-meta">
            <span class="recruit-badge ${isOpen ? 'recruit-open' : 'recruit-close'}">${isOpen ? '✅ 모집 중' : '❌ 마감'}</span>
          </div>
          ${reasonLines.length ? `
          <div class="match-reason-box">
            ${reasonLines.map(r => `<div class="reason-row"><span class="reason-icon">🎯</span><span class="reason-text">${r}</span></div>`).join('')}
          </div>` : ''}
          <div class="match-card-footer">
            <a class="btn-primary" href="email.html">✉️ 메일 쓰기</a>
            <a class="btn-outline-sm" href="${url}" target="_blank" rel="noopener">연구실 사이트 →</a>
          </div>
        </div>`;
    });

    return `
      <div class="results-header">
        <div class="results-eyebrow">MATCH 모드 — 맞춤 추천</div>
        <h2 class="results-headline">나에게 딱 맞는 연구실 Top 3 🏆</h2>
        <p class="results-sub">키워드 일치도·활동방식·모집 여부를 종합한 점수 기준입니다.</p>
      </div>
      <div class="match-grid">${cards.join('')}</div>`;
  }

  /* ── sessionStorage 결과 렌더링 ──────────────────────── */
  (function () {
    const raw = sessionStorage.getItem('labResult');
    const liteBox  = document.getElementById('mode-lite');
    const matchBox = document.getElementById('mode-match');

    if (!raw) {
      // 데이터 없음 — MATCH 탭 클릭 시 안내
      document.getElementById('tab-match').addEventListener('click', function(e) {
        e.preventDefault();
        matchBox.innerHTML = `
          <div style="text-align:center;padding:80px 24px;color:var(--colors-graphite)">
            <div style="font-size:48px;margin-bottom:16px">🔍</div>
            <h3 style="font-size:20px;font-weight:500;margin-bottom:8px">추가 정보를 입력하면 맞춤 추천을 받을 수 있어요</h3>
            <p style="margin-bottom:24px">연구 목적, 활동 방식, 보유 역량 중 하나 이상을 선택해 주세요.</p>
            <a class="btn-primary" href="index.html#form-section">추가 정보 입력하기</a>
          </div>`;
        showMode('match');
      });
      return;
    }

    const { text, thread_id, mode, keywords } = JSON.parse(raw);

    if (mode === 'match') {
      matchBox.innerHTML = renderMatchCards(text);
      showMode('match');
    } else {
      const cards = parseLiteCards(text, keywords || []);
      liteBox.innerHTML = cards ? renderLiteCards(cards, keywords || []) : `<div style="white-space:pre-wrap;line-height:1.9;padding:24px">${text}</div>`;
      showMode('lite');

      // MATCH 탭 클릭 시 안내
      document.getElementById('tab-match').addEventListener('click', function(e) {
        e.preventDefault();
        matchBox.innerHTML = `
          <div style="text-align:center;padding:80px 24px;color:var(--colors-graphite)">
            <div style="font-size:48px;margin-bottom:16px">✨</div>
            <h3 style="font-size:20px;font-weight:500;margin-bottom:8px">선택 정보를 입력하면 Top 3 맞춤 추천을 받을 수 있어요!</h3>
            <p style="margin-bottom:24px">연구 목적, 활동 방식, 보유 역량 중 하나 이상을 선택해 주세요.</p>
            <a class="btn-primary" href="index.html#form-section">추가 정보 입력하기</a>
          </div>`;
        showMode('match');
      });
    }

    sessionStorage.setItem('emailThreadId', thread_id || '');
    sessionStorage.setItem('searchKeywords', JSON.stringify(keywords || []));
  })();
</script>
</body>
</html>
